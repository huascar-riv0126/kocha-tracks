<section class="map-page" aria-label="Mapa base de Cochabamba">
  <aside class="sidebar-slot" aria-label="Espacio reservado para la barra lateral"></aside>
  <div id="map" class="map-canvas" data-testid="map-canvas" role="application" aria-label="Mapa interactivo de Cochabamba"></div>

  <!-- HU-9: Modal de información de evento -->
  <div 
    *ngIf="selectedEvent" 
    class="fixed inset-0 z-[9999] flex items-center justify-center p-4 bg-black/50 backdrop-blur-xs"
    (click)="closeModal()"
    role="dialog"
    aria-modal="true"
  >
    <div 
      class="relative w-full max-w-md bg-white rounded-xl shadow-2xl p-6 border border-gray-100"
      (click)="$event.stopPropagation()"
    >
      <!-- Botón de cierre (✕) -->
      <button 
        (click)="closeModal()"
        class="absolute top-4 right-4 text-gray-400 hover:text-gray-600 text-xl font-bold focus:outline-none"
        aria-label="Cerrar modal"
      >
        &times;
      </button>

      <!-- 1. Nombre -->
      <div class="pr-6 mb-3">
        <span class="text-xs font-bold tracking-wider text-blue-600 uppercase">Detalle del Evento</span>
        <h3 class="text-lg font-bold text-gray-900 mt-1">
          {{ selectedEvent?.nombre }}
        </h3>
      </div>

      <!-- 2. Ubicación -->
      <div class="flex items-start gap-2 mb-4 text-sm text-gray-600">
        <span class="text-base leading-none">📍</span>
        <span>{{ selectedEvent?.ubicacion }}</span>
      </div>

      <!-- 3. Fuentes -->
      <div class="mb-5">
        <p class="text-xs font-semibold text-gray-500 uppercase mb-2">Fuentes verificadas:</p>
        <div class="flex flex-wrap gap-1.5">
          <span 
            *ngFor="let fuente of selectedEvent?.fuentes"
            class="px-2.5 py-1 rounded-full text-xs font-medium bg-gray-100 text-gray-700 border border-gray-200"
          >
            {{ fuente }}
          </span>
        </div>
      </div>

      <!-- 4. Botón requerido -->
      <div class="flex justify-end gap-2 pt-3 border-t border-gray-100">
        <button 
          (click)="closeModal()" 
          class="px-4 py-2 text-sm font-medium text-gray-600 hover:bg-gray-100 rounded-lg transition-colors"
        >
          Cerrar
        </button>
        <button 
          (click)="onActionClick()" 
          class="px-4 py-2 text-sm font-medium text-white bg-blue-600 hover:bg-blue-700 rounded-lg shadow-sm transition-colors"
        >
          Ver alternativa
        </button>
      </div>
    </div>
  </div>
</section>
