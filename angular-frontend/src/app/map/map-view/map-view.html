<section class="map-page" [class.embedded]="embedded()" aria-label="Mapa base de Cochabamba">
  @if (!embedded()) {
  <!-- HU-7: Panel lateral de reportes activos e históricos -->
  <aside class="sidebar-slot" aria-label="Panel lateral de reportes">
    <app-sidebar-reports (eventSelected)="onSidebarEventSelect($event)"></app-sidebar-reports>
  </aside>
  }

  <!-- Contenedor del mapa Leaflet -->
  <div [id]="mapId()" class="map-canvas" data-testid="map-canvas" role="application" aria-label="Mapa interactivo de Cochabamba"></div>
</section>
