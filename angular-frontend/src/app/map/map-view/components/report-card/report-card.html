<article 
  (click)="onSelect()"
  class="bg-[var(--color-surface)] border rounded-lg p-3 mb-2.5 cursor-pointer transition-all duration-200 flex flex-col gap-1.5 focus:outline-hidden"
  [ngClass]="isSelected 
    ? 'border-[var(--color-interactive-cta)] ring-1 ring-[var(--color-interactive-cta)]' 
    : 'border-[var(--color-border-default)] hover:border-[var(--color-neutral-300)] hover:shadow-xs'"
  role="button"
  tabindex="0"
>
  <div class="flex justify-between items-center gap-2">
    <div class="flex items-center gap-2 overflow-hidden">
      <!-- Círculo de estado visual -->
      <span 
        class="w-2 h-2 rounded-full shrink-0" 
        [ngClass]="event.state === 'activo' ? 'bg-[var(--color-interactive-cta)]' : 'bg-[var(--color-status-success-500)]'"
        [attr.aria-label]="('sidebar.status' | getStrings) + ': ' + event.state"
      ></span>
      <h4 class="m-0 text-[13px] font-bold text-[var(--color-txt-primary)] truncate" [title]="event.title">
        {{ event.title }}
      </h4>
    </div>
    <span class="text-[11px] text-[var(--color-neutral-400)] whitespace-nowrap">
      {{ 'sidebar.ago' | getStrings }} {{ event.elapsedTime }}
    </span>
  </div>

  <p class="m-0 text-[11px] text-[var(--color-txt-secondary)] pl-4">
    {{ event.title.includes(' - ') ? (event.title.split(' - ')[1]) : ('sidebar.urban.zone' | getStrings) }}
  </p>

  <div class="flex justify-between items-center mt-1 pl-4">
    <span class="text-[11px] text-[var(--color-neutral-400)]">
      14 {{ 'sidebar.reports.count' | getStrings }}
    </span>
    <span *ngIf="isSelected" class="text-[11px] font-semibold text-[var(--color-interactive-cta)]">
      {{ 'sidebar.selected' | getStrings }}
    </span>
  </div>
</article>
