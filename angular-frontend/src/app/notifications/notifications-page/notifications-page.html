<div
  class="mx-auto flex max-w-6xl flex-col gap-6 px-4 py-8 sm:px-6"
  data-testid="notifications-page"
>
  <h1 class="text-2xl font-bold text-txt-primary" data-testid="notifications-page-title">
    {{ 'notifications.page.title' | getStrings }}
  </h1>

  <div class="flex flex-wrap items-center justify-between gap-4">
    <div class="flex flex-wrap items-center gap-2" role="group">
      @for (filter of filters; track filter.key) {
        <button
          type="button"
          (click)="selectFilter(filter.key)"
          class="cursor-pointer rounded-full px-4 py-1.5 text-xs font-semibold transition-colors"
          [ngClass]="activeFilter() === filter.key ? activePillClass : inactivePillClass"
          [attr.aria-pressed]="activeFilter() === filter.key"
          [attr.data-testid]="'filter-' + filter.key"
        >
          {{ filter.labelKey | getStrings }}
        </button>
      }
    </div>

    <button
      type="button"
      (click)="markAllAsRead()"
      [disabled]="unreadCount() === 0"
      class="cursor-pointer text-xs font-semibold text-interactive-cta hover:underline disabled:cursor-not-allowed disabled:opacity-50"
      data-testid="mark-all-read"
    >
      {{ 'notifications.actions.mark_all_read' | getStrings }}
    </button>
  </div>

  <app-notification-list [notifications]="notifications()" (cardClick)="onCardClick($event)" />
</div>
