<article
  (click)="onCardClick()"
  (keydown.enter)="onCardClickFromKeyboard($event)"
  (keydown.space)="onCardClickFromKeyboard($event)"
  class="relative flex cursor-pointer items-start gap-3 rounded-xl border border-border-default bg-surface p-4 transition-all duration-200 hover:border-neutral-300 hover:shadow-sm focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-primary-500"
  role="button"
  tabindex="0"
  [attr.aria-label]="('notifications.card.open' | getStrings) + ': ' + notification().title"
  data-testid="notification-card"
>
  <!-- Tipo: rojo = evento nuevo, amarillo = actualización, verde = finalización -->
  <span
    class="mt-1.5 size-2.5 shrink-0 rounded-full"
    [ngClass]="typeDotClass()"
    [class.animate-pulse]="isUnread()"
    data-testid="notification-type-dot"
    aria-hidden="true"
  ></span>

  <div class="min-w-0 flex-1">
    <h3
      class="m-0 truncate text-sm font-bold text-txt-primary"
      [title]="notification().title"
      data-testid="notification-title"
    >
      {{ notification().title }}
    </h3>

    <p
      class="m-0 mt-1 line-clamp-2 text-xs leading-5 text-txt-secondary"
      data-testid="notification-description"
    >
      {{ notification().description }}
    </p>
  </div>

  <div class="flex shrink-0 items-center gap-1.5">
    <!-- Punto azul de no leída, inmediatamente antes del botón de 3 puntos -->
    @if (isUnread()) {
      <span
        class="size-2 rounded-full bg-brand-primary-500"
        data-testid="notification-unread-dot"
        aria-hidden="true"
      ></span>
    }

    <button
      type="button"
      (click)="onMenuClick($event)"
      class="inline-flex size-8 cursor-pointer items-center justify-center rounded-md border-0 bg-transparent text-neutral-500 transition-colors hover:bg-neutral-100 hover:text-txt-primary focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-brand-primary-500"
      [attr.aria-label]="'notifications.card.menu' | getStrings"
      data-testid="notification-menu-button"
    >
      <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
        <circle cx="5" cy="12" r="1.75" />
        <circle cx="12" cy="12" r="1.75" />
        <circle cx="19" cy="12" r="1.75" />
      </svg>
    </button>
  </div>
</article>
