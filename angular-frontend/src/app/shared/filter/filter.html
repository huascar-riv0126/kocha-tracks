<div class="flex flex-wrap gap-2" role="group" data-testid="filter">
  <button
    type="button"
    data-testid="filter-chip-all"
    [attr.aria-pressed]="selected() === null"
    class="cursor-pointer rounded-full border px-4 py-1.5 text-sm font-medium transition-colors focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-interactive-primary"
    [class]="
      selected() === null
        ? 'border-interactive-cta bg-interactive-cta text-on-dark'
        : 'border-border-default bg-surface text-txt-primary hover:bg-section-alt'
    "
    (click)="select(null)"
  >
    {{ 'filter.all' | getStrings }}
  </button>
  @for (option of options(); track option.value) {
    <button
      type="button"
      data-testid="filter-chip"
      [attr.aria-pressed]="selected() === option.value"
      class="cursor-pointer rounded-full border px-4 py-1.5 text-sm font-medium transition-colors focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-interactive-primary"
      [class]="
        selected() === option.value
          ? 'border-interactive-cta bg-interactive-cta text-on-dark'
          : 'border-border-default bg-surface text-txt-primary hover:bg-section-alt'
      "
      (click)="select(option.value)"
    >
      {{ option.label }}
    </button>
  }
</div>
