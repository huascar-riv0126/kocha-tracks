<h2>Employee List</h2>

@if (employees$ | async; as employees) {
<table class="table table-striped">
    <thead>
        <tr>
            <th>Firstname:</th>
            <th>Lastname:</th>
            <th>Actions</th>
        </tr>
    </thead>

    <tbody>
        @for (employee of employees; track employee.id) {
        <tr>
            <td>{{ employee.firstname }}</td>
            <td>{{ employee.lastname }}</td>
            <td>
                <button (click)="goToDetails(employee.id)" class="btn btn-info">WATCH</button>
                <button (click)="goToUpdate(employee.id)" class="btn btn-warning">UPDATE</button>
                <button (click)="deleteEmployee(employee.id)" class="btn btn-danger">DELETE</button>
            </td>
        </tr>
        } @empty {
        <tr>
            <td colspan="3" class="text-center">
                No employees
            </td>
        </tr>
        }
    </tbody>
</table>
}
