<section
  class="h-full rounded-xl border border-border-default bg-section-alt p-6 font-sans text-txt-primary"
>

    <svg
      class="size-5 shrink-0 text-accent"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      aria-hidden="true"
    >
      <circle cx="12" cy="12" r="9" />
      <path d="M12 11v5M12 8h.01" />
    </svg>
    {{ 'historyHelp.title' | transloco }}
  </h2>
  <div class="mt-4 space-y-3 text-sm leading-6 text-txt-secondary">
    <p>{{ 'historyHelp.changes' | transloco }}</p>
    <p>{{ 'historyHelp.status' | transloco }}</p>
    <p>{{ 'historyHelp.timezone' | transloco }}</p>
  </div>
</section>
