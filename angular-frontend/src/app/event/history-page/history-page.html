<section class="bg-page font-sans text-txt-primary">
  <div class="mx-auto flex max-w-7xl flex-col gap-8 px-4 py-8 sm:px-6 lg:px-10 lg:py-12">
    <header>
      <a
        routerLink="/map"
        class="mb-5 inline-flex items-center gap-2 rounded text-sm font-medium text-link hover:underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-interactive-primary"
      >
        <span aria-hidden="true">←</span>
        {{ 'eventHistoryPage.backToMap' | transloco }}
      </a>
      <h1 class="text-3xl font-bold sm:text-4xl">{{ 'eventHistoryPage.title' | transloco }}</h1>
      <p class="mt-3 max-w-3xl text-base text-txt-secondary">
        {{ 'eventHistoryPage.description' | transloco }}
      </p>
      <p
        class="mt-4 rounded-md border border-border-default bg-surface p-3 text-sm text-txt-secondary"
      >
        {{ 'eventHistoryPage.exampleNotice' | transloco }}
      </p>
    </header>

    <app-history-event-card [event]="event()" />
    <app-event-history [changes]="changes()" />

    <div class="grid min-w-0 gap-6 lg:grid-cols-2">
      <app-history-sources-card [eventId]="event().id" [sources]="example().sources" />
      <app-history-help-card />
    </div>
  </div>
</section>
