<main class="min-h-dvh bg-page flex items-center justify-center px-6 py-16" role="main">
    <section class="w-full max-w-lg text-center">
        <p class="text-8xl sm:text-9xl font-extrabold tracking-tight text-brand-primary-200 select-none"
            aria-hidden="true">
            404
        </p>

        <h1 class="mt-4 text-2xl sm:text-3xl font-bold text-txt-primary">
            Página no encontrada
        </h1>

        <p class="mt-3 text-base text-txt-secondary">
            La página que buscas no existe o fue movida. Verifica la URL o
            regresa a un lugar seguro.
        </p>

        <div class="mt-8 flex flex-col-reverse sm:flex-row items-center justify-center gap-3">
            @if (canGoBack) {
            <button type="button" (click)="goBack()"
                class="w-full sm:w-auto inline-flex items-center justify-center gap-2 rounded-md border border-border-default bg-surface px-5 py-3 text-sm font-bold text-txt-primary transition-colors hover:bg-section-alt hover:border-brand-primary-300 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-interactive-primary cursor-pointer">
                Volver atrás
            </button>
            }

            <a routerLink="/"
                class="w-full sm:w-auto inline-flex items-center justify-center gap-2 rounded-md bg-interactive-primary px-5 py-3 text-sm font-bold text-on-dark transition-colors hover:bg-interactive-primary-hover focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-interactive-primary">
                Ir al inicio
            </a>
        </div>
    </section>
</main>
