
<main
  class="flex min-h-screen items-center justify-center bg-section-alt px-4 py-10 font-sans"
>
  <section
    class="w-full max-w-[714px] rounded-xl border border-border-default bg-surface px-6 py-10 shadow-lg sm:px-12 sm:py-14"
  >
    <app-brand
      variant="light"
      [isClickable]="false"
    />

    <h1
      class="mb-10 mt-10 text-center text-2xl font-bold text-txt-primary"
    >
      {{ 'auth.changePassword.title' | getStrings }}
    </h1>

    <form
      class="space-y-5"
      (submit)="onSubmit($event)"
    >
      <!-- Contraseña anterior -->
      <div>
        <label
          for="currentPassword"
          class="mb-2 block text-sm font-semibold text-txt-primary"
        >
          {{ 'auth.changePassword.current' | getStrings }}
        </label>

        <div class="relative">
          <input
            id="currentPassword"
            name="currentPassword"
            data-testid="current-password"
            [type]="showCurrentPassword() ? 'text' : 'password'"
            [value]="currentPassword()"
            (input)="onCurrentPasswordInput($event)"
            autocomplete="current-password"
            class="h-12 w-full rounded-lg border border-border-default bg-surface px-4 pr-12 text-txt-primary outline-none focus:border-interactive-cta focus:ring-2 focus:ring-accent-warning-100"
          />

          <button
            type="button"
            data-testid="toggle-current-password"
            (click)="toggleCurrentPassword()"
            [attr.aria-label]="
              (showCurrentPassword()
                ? 'auth.changePassword.hide'
                : 'auth.changePassword.show') | getStrings
            "
            [attr.aria-pressed]="showCurrentPassword()"
            class="absolute right-3 top-1/2 -translate-y-1/2 cursor-pointer rounded text-txt-secondary hover:text-txt-primary focus-visible:outline-2 focus-visible:outline-interactive-cta"
          >
            @if (showCurrentPassword()) {
              <span aria-hidden="true">◉</span>
            } @else {
              <span aria-hidden="true">◎</span>
            }
          </button>
        </div>
      </div>

      <!-- Nueva contraseña -->
      <div>
        <label
          for="newPassword"
          class="mb-2 block text-sm font-semibold text-txt-primary"
        >
          {{ 'auth.changePassword.new' | getStrings }}
        </label>

        <div class="relative">
          <input
            id="newPassword"
            name="newPassword"
            data-testid="new-password"
            [type]="showNewPassword() ? 'text' : 'password'"
            [value]="newPassword()"
            (input)="onNewPasswordInput($event)"
            autocomplete="new-password"
            class="h-12 w-full rounded-lg border border-border-default bg-surface px-4 pr-12 text-txt-primary outline-none focus:border-interactive-cta focus:ring-2 focus:ring-accent-warning-100"
          />

          <button
            type="button"
            data-testid="toggle-new-password"
            (click)="toggleNewPassword()"
            [attr.aria-label]="
              (showNewPassword()
                ? 'auth.changePassword.hide'
                : 'auth.changePassword.show') | getStrings
            "
            [attr.aria-pressed]="showNewPassword()"
            class="absolute right-3 top-1/2 -translate-y-1/2 cursor-pointer rounded text-txt-secondary hover:text-txt-primary focus-visible:outline-2 focus-visible:outline-interactive-cta"
          >
            @if (showNewPassword()) {
              <span aria-hidden="true">◉</span>
            } @else {
              <span aria-hidden="true">◎</span>
            }
          </button>
        </div>
      </div>

      <!-- Confirmación -->
      <div>
        <label
          for="confirmPassword"
          class="mb-2 block text-sm font-semibold text-txt-primary"
        >
          {{ 'auth.changePassword.confirm' | getStrings }}
        </label>

        <div class="relative">
          <input
            id="confirmPassword"
            name="confirmPassword"
            data-testid="confirm-password"
            [type]="showConfirmPassword() ? 'text' : 'password'"
            [value]="confirmPassword()"
            (input)="onConfirmPasswordInput($event)"
            autocomplete="new-password"
            [attr.aria-invalid]="passwordsMismatch()"
            aria-describedby="password-match-message"
            class="h-12 w-full rounded-lg border border-border-default bg-surface px-4 pr-12 text-txt-primary outline-none focus:border-interactive-cta focus:ring-2 focus:ring-accent-warning-100"
          />

          @if (passwordsMatch()) {
            <span
              data-testid="password-match"
              class="absolute right-12 top-1/2 -translate-y-1/2 font-bold text-status-success-500"
              aria-hidden="true"
            >
              ✓
            </span>
          }

          @if (passwordsMismatch()) {
            <span
              data-testid="password-mismatch"
              class="absolute right-12 top-1/2 -translate-y-1/2 font-bold text-status-danger-500"
              aria-hidden="true"
            >
              ⓧ
            </span>
          }

          <button
            type="button"
            data-testid="toggle-confirm-password"
            (click)="toggleConfirmPassword()"
            [attr.aria-label]="
              (showConfirmPassword()
                ? 'auth.changePassword.hide'
                : 'auth.changePassword.show') | getStrings
            "
            [attr.aria-pressed]="showConfirmPassword()"
            class="absolute right-3 top-1/2 -translate-y-1/2 cursor-pointer rounded text-txt-secondary hover:text-txt-primary focus-visible:outline-2 focus-visible:outline-interactive-cta"
          >
            @if (showConfirmPassword()) {
              <span aria-hidden="true">◉</span>
            } @else {
              <span aria-hidden="true">◎</span>
            }
          </button>
        </div>

        <p
          id="password-match-message"
          class="mt-2 text-sm"
          [class.text-status-danger-500]="passwordsMismatch()"
          [class.text-status-success-500]="passwordsMatch()"
          aria-live="polite"
        >
          @if (passwordsMismatch()) {
            {{ 'auth.changePassword.mismatch' | getStrings }}
          } @else if (passwordsMatch()) {
            {{ 'auth.changePassword.match' | getStrings }}
          }
        </p>
      </div>

      <button
        type="submit"
        data-testid="change-password-submit"
        [disabled]="!canSubmit()"
        class="mt-7 flex h-14 w-full items-center justify-center gap-2 rounded-lg bg-interactive-cta font-semibold text-on-dark transition hover:bg-interactive-cta-hover focus-visible:outline-2 focus-visible:outline-interactive-cta disabled:cursor-not-allowed disabled:opacity-50"
      >
        <span aria-hidden="true">♙</span>
        {{ 'auth.changePassword.submit' | getStrings }}
      </button>
    </form>
  </section>
</main>
