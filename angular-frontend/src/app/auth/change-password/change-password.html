
<main
  class="flex min-h-screen items-center justify-center bg-section-alt px-4 py-10 font-sans"
>
  <section
    class="w-full max-w-[714px] rounded-xl border border-border-default bg-surface px-6 py-10 shadow-lg sm:px-12 sm:py-14"
  >
    <!-- Logo Kocha Tracks -->
    <app-brand
      variant="light"
      [isClickable]="false"
    />

    <!-- Título -->
    <h1
      class="mb-10 mt-10 text-center text-2xl font-bold text-txt-primary"
    >
      {{ 'auth.changePassword.title' | getStrings }}
    </h1>

    <form
      class="space-y-5"
      (submit)="onSubmit($event)"
    >
      <!-- CONTRASEÑA ANTERIOR -->
      <div>
        <label
          for="currentPassword"
          class="mb-2 block text-sm font-semibold text-txt-primary"
        >
          {{ 'auth.changePassword.current' | getStrings }}
        </label>

        <div class="relative">
          <input
            id="currentPassword"
            name="currentPassword"
            data-testid="current-password"
            [type]="showCurrentPassword() ? 'text' : 'password'"
            [value]="currentPassword()"
            (input)="onCurrentPasswordInput($event)"
            autocomplete="current-password"
            class="h-12 w-full rounded-lg border border-border-default bg-surface px-4 pr-12 text-txt-primary outline-none focus:border-interactive-cta focus:ring-2 focus:ring-accent-warning-100"
          />

          <button
            type="button"
            data-testid="toggle-current-password"
            (click)="toggleCurrentPassword()"
            [attr.aria-label]="
              (showCurrentPassword()
                ? 'auth.changePassword.hide'
                : 'auth.changePassword.show') | getStrings
            "
            [attr.aria-pressed]="showCurrentPassword()"
            class="absolute right-3 top-1/2 flex -translate-y-1/2 cursor-pointer items-center justify-center rounded p-1 text-txt-secondary transition-colors hover:text-txt-primary focus-visible:outline-2 focus-visible:outline-interactive-cta"
          >
            @if (showCurrentPassword()) {
              <!-- Ojo tachado: ocultar contraseña -->
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="m10.58 10.58 2.84 2.84" />
                <path d="M9.88 5.09A10.94 10.94 0 0 1 12 4.9c7 0 10 7.1 10 7.1a13.16 13.16 0 0 1-4.24 5.24" />
                <path d="M6.61 6.61A13.32 13.32 0 0 0 2 12s3 7.1 10 7.1a10.45 10.45 0 0 0 4.5-.99" />
                <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8" />
                <path d="m2 2 20 20" />
              </svg>
            } @else {
              <!-- Ojo abierto: mostrar contraseña -->
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            }
          </button>
        </div>
      </div>

      <!-- NUEVA CONTRASEÑA -->
      <div>
        <label
          for="newPassword"
          class="mb-2 block text-sm font-semibold text-txt-primary"
        >
          {{ 'auth.changePassword.new' | getStrings }}
        </label>

        <div class="relative">
          <input
            id="newPassword"
            name="newPassword"
            data-testid="new-password"
            [type]="showNewPassword() ? 'text' : 'password'"
            [value]="newPassword()"
            (input)="onNewPasswordInput($event)"
            autocomplete="new-password"
            class="h-12 w-full rounded-lg border border-border-default bg-surface px-4 pr-12 text-txt-primary outline-none focus:border-interactive-cta focus:ring-2 focus:ring-accent-warning-100"
          />

          <button
            type="button"
            data-testid="toggle-new-password"
            (click)="toggleNewPassword()"
            [attr.aria-label]="
              (showNewPassword()
                ? 'auth.changePassword.hide'
                : 'auth.changePassword.show') | getStrings
            "
            [attr.aria-pressed]="showNewPassword()"
            class="absolute right-3 top-1/2 flex -translate-y-1/2 cursor-pointer items-center justify-center rounded p-1 text-txt-secondary transition-colors hover:text-txt-primary focus-visible:outline-2 focus-visible:outline-interactive-cta"
          >
            @if (showNewPassword()) {
              <!-- Ojo tachado -->
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="m10.58 10.58 2.84 2.84" />
                <path d="M9.88 5.09A10.94 10.94 0 0 1 12 4.9c7 0 10 7.1 10 7.1a13.16 13.16 0 0 1-4.24 5.24" />
                <path d="M6.61 6.61A13.32 13.32 0 0 0 2 12s3 7.1 10 7.1a10.45 10.45 0 0 0 4.5-.99" />
                <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8" />
                <path d="m2 2 20 20" />
              </svg>
            } @else {
              <!-- Ojo abierto -->
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            }
          </button>
        </div>
      </div>

      <!-- CONFIRMAR NUEVA CONTRASEÑA -->
      <div>
        <label
          for="confirmPassword"
          class="mb-2 block text-sm font-semibold text-txt-primary"
        >
          {{ 'auth.changePassword.confirm' | getStrings }}
        </label>

        <div class="relative">
          <input
            id="confirmPassword"
            name="confirmPassword"
            data-testid="confirm-password"
            [type]="showConfirmPassword() ? 'text' : 'password'"
            [value]="confirmPassword()"
            (input)="onConfirmPasswordInput($event)"
            autocomplete="new-password"
            [attr.aria-invalid]="passwordsMismatch()"
            aria-describedby="password-match-message"
            class="h-12 w-full rounded-lg border border-border-default bg-surface px-4 pr-20 text-txt-primary outline-none focus:border-interactive-cta focus:ring-2 focus:ring-accent-warning-100"
          />

          <!-- Indicador de contraseña correcta -->
          @if (passwordsMatch()) {
            <span
              data-testid="password-match"
              class="absolute right-12 top-1/2 flex -translate-y-1/2 items-center justify-center text-status-success-500"
              aria-hidden="true"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="9" />
                <path d="m8 12 2.5 2.5L16 9" />
              </svg>
            </span>
          }

          <!-- Indicador de contraseña incorrecta -->
          @if (passwordsMismatch()) {
            <span
              data-testid="password-mismatch"
              class="absolute right-12 top-1/2 flex -translate-y-1/2 items-center justify-center text-status-danger-500"
              aria-hidden="true"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="9" />
                <path d="m9 9 6 6" />
                <path d="m15 9-6 6" />
              </svg>
            </span>
          }

          <button
            type="button"
            data-testid="toggle-confirm-password"
            (click)="toggleConfirmPassword()"
            [attr.aria-label]="
              (showConfirmPassword()
                ? 'auth.changePassword.hide'
                : 'auth.changePassword.show') | getStrings
            "
            [attr.aria-pressed]="showConfirmPassword()"
            class="absolute right-3 top-1/2 flex -translate-y-1/2 cursor-pointer items-center justify-center rounded p-1 text-txt-secondary transition-colors hover:text-txt-primary focus-visible:outline-2 focus-visible:outline-interactive-cta"
          >
            @if (showConfirmPassword()) {
              <!-- Ojo tachado -->
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="m10.58 10.58 2.84 2.84" />
                <path d="M9.88 5.09A10.94 10.94 0 0 1 12 4.9c7 0 10 7.1 10 7.1a13.16 13.16 0 0 1-4.24 5.24" />
                <path d="M6.61 6.61A13.32 13.32 0 0 0 2 12s3 7.1 10 7.1a10.45 10.45 0 0 0 4.5-.99" />
                <path d="M10.6 10.6a2 2 0 0 0 2.8 2.8" />
                <path d="m2 2 20 20" />
              </svg>
            } @else {
              <!-- Ojo abierto -->
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            }
          </button>
        </div>

        <!-- Mensaje de validación -->
        <p
          id="password-match-message"
          class="mt-2 text-sm"
          [class.text-status-danger-500]="passwordsMismatch()"
          [class.text-status-success-500]="passwordsMatch()"
          aria-live="polite"
        >
          @if (passwordsMismatch()) {
            {{ 'auth.changePassword.mismatch' | getStrings }}
          } @else if (passwordsMatch()) {
            {{ 'auth.changePassword.match' | getStrings }}
          }
        </p>
      </div>

      <!-- Botón para cambiar contraseña -->
      <button
        type="submit"
        data-testid="change-password-submit"
        [disabled]="!canSubmit()"
        class="mt-7 flex h-14 w-full items-center justify-center gap-2 rounded-lg bg-interactive-cta font-semibold text-on-dark transition hover:bg-interactive-cta-hover focus-visible:outline-2 focus-visible:outline-interactive-cta disabled:cursor-not-allowed disabled:opacity-50"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect x="5" y="11" width="14" height="10" rx="2" />
          <path d="M8 11V7a4 4 0 0 1 8 0v4" />
        </svg>

        {{ 'auth.changePassword.submit' | getStrings }}
      </button>
    </form>
  </section>
</main>
