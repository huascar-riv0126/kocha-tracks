
<main
  class="flex min-h-screen items-center justify-center bg-section-alt px-4 py-10 font-sans"
>
  <section
    class="w-full max-w-[560px] rounded-xl border border-border-default bg-surface px-6 py-10 shadow-lg sm:px-12 sm:py-12"
  >
    <!-- Marca Kocha Tracks -->
    <app-brand
      variant="light"
      [isClickable]="false"
    />

    <!-- Título -->
    <h1
      class="mt-9 text-center text-2xl font-bold text-txt-primary"
    >
      {{ 'auth.recovery.title' | getStrings }}
    </h1>

    <!-- Descripción -->
    <p
      class="mx-auto mt-3 max-w-md text-center text-sm leading-6 text-txt-secondary"
    >
      {{ 'auth.recovery.description' | getStrings }}
    </p>

    <!-- Formulario -->
    <form
      class="mt-9 space-y-6"
      (submit)="onSubmit($event)"
      novalidate
    >
      <div>
        <label
          for="recoveryEmail"
          class="mb-2 block text-sm font-semibold text-txt-primary"
        >
          {{ 'auth.recovery.email.label' | getStrings }}
        </label>

        <input
          id="recoveryEmail"
          name="recoveryEmail"
          data-testid="recovery-email"
          type="email"
          autocomplete="email"
          required
          [value]="email()"
          [placeholder]="
            'auth.recovery.email.placeholder' | getStrings
          "
          [attr.aria-invalid]="emailError() !== null"
          aria-describedby="recovery-email-error"
          (input)="onEmailInput($event)"
          (blur)="onEmailBlur()"
          class="h-12 w-full rounded-lg border border-border-default bg-surface px-4 text-sm text-txt-primary outline-none transition placeholder:text-txt-secondary focus:border-interactive-cta focus:ring-2 focus:ring-accent-warning-100"
          [class.border-status-danger-500]="emailError() !== null"
        />

        <p
          id="recovery-email-error"
          data-testid="recovery-email-error"
          class="mt-2 text-sm text-status-danger-500"
          aria-live="polite"
        >
          @if (emailError(); as error) {
            {{ error | getStrings }}
          }
        </p>
      </div>

      <!-- Botón principal -->
      <button
        data-testid="recovery-submit"
        type="submit"
        [disabled]="!canSubmit()"
        class="flex h-12 w-full items-center justify-center gap-2 rounded-lg bg-interactive-cta px-4 text-sm font-bold text-on-dark transition hover:bg-interactive-cta-hover focus-visible:outline-2 focus-visible:outline-interactive-cta disabled:cursor-not-allowed disabled:opacity-50"
      >
        <svg
          class="h-5 w-5"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect
            x="3"
            y="5"
            width="18"
            height="14"
            rx="2"
          ></rect>
          <path d="m3 7 9 6 9-6"></path>
        </svg>

        {{ 'auth.recovery.submit' | getStrings }}
      </button>

      <!-- Regresar -->
      <div class="text-center">
        <a
          routerLink="/login"
          data-testid="back-to-login"
          class="inline-flex items-center gap-2 text-sm font-medium text-interactive-cta underline hover:text-interactive-cta-hover focus-visible:outline-2 focus-visible:outline-interactive-cta"
        >
          <span aria-hidden="true">←</span>

          {{ 'auth.recovery.back' | getStrings }}
        </a>
      </div>
    </form>
  </section>
</main>
