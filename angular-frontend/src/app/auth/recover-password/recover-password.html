
<main
  class="flex min-h-screen items-center justify-center bg-section-alt px-4 py-10 font-sans"
>
  <section
    class="w-full max-w-[570px] rounded-xl border border-border-default bg-surface px-6 py-10 shadow-lg sm:px-12 sm:py-12"
  >
    <!-- Logo -->
    <app-brand
      variant="light"
      [isClickable]="false"
    />

    <!-- Título -->
    <h1
      class="mb-9 mt-9 text-center text-2xl font-bold text-txt-primary"
    >
      {{ 'auth.recovery.title' | transloco }}
    </h1>

    <form
      class="space-y-5"
      (submit)="onSubmit($event)"
      novalidate
    >
      <!-- Nueva contraseña -->
      <div>
        <label
          for="newPassword"
          class="mb-2 block text-sm font-semibold text-txt-primary"
        >
          {{ 'auth.recovery.new' | transloco }}
        </label>

        <div class="relative">
          <input
            id="newPassword"
            name="newPassword"
            data-testid="recovery-new-password"
            [type]="showNewPassword() ? 'text' : 'password'"
            [value]="newPassword()"
            (input)="onNewPasswordInput($event)"
            autocomplete="new-password"
            class="h-12 w-full rounded-lg border border-border-default bg-surface px-4 pr-12 text-sm text-txt-primary outline-none transition focus:border-interactive-cta focus:ring-2 focus:ring-accent-warning-100"
          />

          <!-- Mostrar / ocultar -->
          <button
            type="button"
            data-testid="toggle-recovery-new-password"
            (click)="toggleNewPassword()"
            [attr.aria-pressed]="showNewPassword()"
            [attr.aria-label]="
              (showNewPassword()
                ? 'auth.recovery.hide'
                : 'auth.recovery.show') | transloco
            "
            class="absolute right-3 top-1/2 flex -translate-y-1/2 items-center justify-center rounded p-1 text-txt-secondary transition hover:text-txt-primary focus-visible:outline-2 focus-visible:outline-interactive-cta"
          >
            @if (showNewPassword()) {
              <!-- Ojo tachado -->
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="m3 3 18 18" />
                <path d="M10.58 10.58a2 2 0 0 0 2.84 2.84" />
                <path d="M9.88 5.09A10.8 10.8 0 0 1 12 4.9c7 0 10 7.1 10 7.1a13.2 13.2 0 0 1-4.24 5.24" />
                <path d="M6.61 6.61A13.3 13.3 0 0 0 2 12s3 7.1 10 7.1a10.5 10.5 0 0 0 4.5-.99" />
              </svg>
            } @else {
              <!-- Ojo abierto -->
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            }
          </button>
        </div>
      </div>

      <!-- Confirmación -->
      <div>
        <label
          for="confirmPassword"
          class="mb-2 block text-sm font-semibold text-txt-primary"
        >
          {{ 'auth.recovery.confirm' | transloco }}
        </label>

        <div class="relative">
          <input
            id="confirmPassword"
            name="confirmPassword"
            data-testid="recovery-confirm-password"
            [type]="showConfirmPassword() ? 'text' : 'password'"
            [value]="confirmPassword()"
            (input)="onConfirmPasswordInput($event)"
            autocomplete="new-password"
            [attr.aria-invalid]="passwordsMismatch()"
            aria-describedby="recovery-match-message"
            class="h-12 w-full rounded-lg border border-border-default bg-surface px-4 pr-20 text-sm text-txt-primary outline-none transition focus:border-interactive-cta focus:ring-2 focus:ring-accent-warning-100"
          />

          <!-- Indicador correcto -->
          @if (passwordsMatch()) {
            <span
              data-testid="recovery-password-match"
              aria-hidden="true"
              class="absolute right-12 top-1/2 flex -translate-y-1/2 text-status-success-500"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="9" />
                <path d="m8 12 2.5 2.5L16 9" />
              </svg>
            </span>
          }

          <!-- Indicador incorrecto -->
          @if (passwordsMismatch()) {
            <span
              data-testid="recovery-password-mismatch"
              aria-hidden="true"
              class="absolute right-12 top-1/2 flex -translate-y-1/2 text-status-danger-500"
            >
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="12" cy="12" r="9" />
                <path d="m9 9 6 6" />
                <path d="m15 9-6 6" />
              </svg>
            </span>
          }

          <!-- Mostrar / ocultar -->
          <button
            type="button"
            data-testid="toggle-recovery-confirm-password"
            (click)="toggleConfirmPassword()"
            [attr.aria-pressed]="showConfirmPassword()"
            [attr.aria-label]="
              (showConfirmPassword()
                ? 'auth.recovery.hide'
                : 'auth.recovery.show') | transloco
            "
            class="absolute right-3 top-1/2 flex -translate-y-1/2 items-center justify-center rounded p-1 text-txt-secondary transition hover:text-txt-primary focus-visible:outline-2 focus-visible:outline-interactive-cta"
          >
            @if (showConfirmPassword()) {
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="m3 3 18 18" />
                <path d="M10.58 10.58a2 2 0 0 0 2.84 2.84" />
                <path d="M9.88 5.09A10.8 10.8 0 0 1 12 4.9c7 0 10 7.1 10 7.1a13.2 13.2 0 0 1-4.24 5.24" />
                <path d="M6.61 6.61A13.3 13.3 0 0 0 2 12s3 7.1 10 7.1a10.5 10.5 0 0 0 4.5-.99" />
              </svg>
            } @else {
              <svg
                xmlns="http://www.w3.org/2000/svg"
                width="20"
                height="20"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
                aria-hidden="true"
              >
                <path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0" />
                <circle cx="12" cy="12" r="3" />
              </svg>
            }
          </button>
        </div>

        <p
          id="recovery-match-message"
          class="mt-2 text-sm"
          [class.text-status-success-500]="passwordsMatch()"
          [class.text-status-danger-500]="passwordsMismatch()"
          aria-live="polite"
        >
          @if (passwordsMatch()) {
            {{ 'auth.recovery.match' | transloco }}
          } @else if (passwordsMismatch()) {
            {{ 'auth.recovery.mismatch' | transloco }}
          }
        </p>
      </div>

      <!-- Botón principal -->
      <button
        type="submit"
        data-testid="recovery-submit"
        [disabled]="!canSubmit()"
        class="mt-8 flex h-12 w-full items-center justify-center gap-2 rounded-lg bg-interactive-cta px-4 text-sm font-bold text-on-dark transition hover:bg-interactive-cta-hover focus-visible:outline-2 focus-visible:outline-interactive-cta disabled:cursor-not-allowed disabled:opacity-50"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="18"
          height="18"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect x="5" y="11" width="14" height="10" rx="2" />
          <path d="M8 11V7a4 4 0 0 1 8 0v4" />
        </svg>

        {{ 'auth.recovery.submit' | transloco }}
      </button>
    </form>
  </section>
</main>
