<article class="flex flex-col p-6 gap-4 rounded-xl border border-border-default bg-card">
  <header class="flex w-full items-center justify-between">
    <h3 class="flex-1 text-lg font-bold text-txt-primary">
      {{ title() }}
    </h3>

    <a [href]="linkHref()" target="_blank" rel="noopener noreferrer" [attr.aria-label]="'Abrir enlace de ' + title()"
      class="flex size-13 shrink-0 items-center justify-center p-2 rounded-lg bg-section-alt">
      <img src="icons/external-link.svg" alt="" class="size-9" />
    </a>
  </header>

  <div class="flex w-full flex-col gap-2">
    <p class="w-full text-sm leading-5 text-txt-secondary">
      {{ description() }}
    </p>
  </div>
</article>
