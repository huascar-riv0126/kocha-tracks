<section class="w-full">
  <div class="flex justify-between gap-10 w-full items-center">
    @for (step of flowSteps; track step.number; let last = $last) {
    <app-data-flow-card [number]="step.number" [title]="step.title" [description]="step.description" />

    @if (!last) {
    <span class="size-5 shrink-0" aria-hidden="true">
      <img src="icons/right-arrow.svg" alt="">
    </span>
    }
    }
  </div>
</section>
