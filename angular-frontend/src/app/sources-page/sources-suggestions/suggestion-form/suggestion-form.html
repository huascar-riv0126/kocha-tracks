<form class="flex w-full flex-col gap-6 rounded-2xl border border-border-default bg-white p-10 lg:w-[600px]">
  <h3 class="text-2xl font-bold text-txt-primary">
    Sugerir Fuente de Datos
  </h3>

  <div class="flex flex-col gap-4 sm:flex-row sm:items-center">
    <div class="flex h-11 flex-1 items-center rounded-lg border border-border-default bg-gray-50 px-4">
      <label for="source-url" class="sr-only">
        URL de la fuente de datos
      </label>

      <input id="source-url" name="sourceUrl" type="url" placeholder="Ej. Pagina web de los Tiempos"
        class="w-full bg-transparent text-sm text-gray-900 outline-none placeholder:text-gray-400" />
    </div>

    <button type="submit"
      class="h-11 shrink-0 rounded-lg bg-interactive-cta px-6 text-sm text-white">
      Enviar Propuesta
    </button>
  </div>
</form>
