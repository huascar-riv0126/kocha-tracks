<section id="por-que" class="flex scroll-mt-16 flex-col gap-10 bg-surface px-6 py-16 lg:px-20 lg:py-20">
  <div class="mx-auto flex w-full max-w-5xl flex-col items-center gap-3 text-center">
    <p class="font-mono text-xs font-semibold uppercase tracking-widest text-interactive-cta">
      {{ 'landing.features.eyebrow' | transloco }}
    </p>
    <h2 class="text-3xl font-extrabold text-txt-primary lg:text-4xl">
      {{ 'landing.features.title' | transloco }}
    </h2>
    <p class="max-w-2xl text-base text-txt-secondary">
      {{ 'landing.features.desc' | transloco }}
    </p>
  </div>
  <div class="mx-auto grid w-full max-w-7xl gap-6 md:grid-cols-3">
    @for (f of features; track f.titleKey) {
    <app-info-card [title]="f.titleKey | transloco" [description]="f.descKey | transloco" [iconSrc]="f.icon" />
    }
  </div>
</section>
