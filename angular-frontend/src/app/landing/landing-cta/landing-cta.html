<section class="flex flex-col items-center gap-5 bg-hero px-6 py-16 text-center lg:py-20">
  <h2 class="max-w-2xl text-3xl font-extrabold text-on-dark lg:text-4xl">
    {{ 'landing.cta.title' | getStrings }}
  </h2>
  <p class="max-w-2xl text-sm leading-6 text-on-dark-muted">
    {{ 'landing.cta.desc' | getStrings }}
  </p>
  <a href="#" onclick="return false;" class="mt-2 rounded-md bg-interactive-cta px-6 py-2.5 text-sm font-bold text-white transition hover:bg-interactive-cta-hover">
    {{ 'landing.cta.button' | getStrings }}
  </a>
  <p class="font-mono text-[11px] text-neutral-400">
    {{ 'landing.cta.note' | getStrings }}
  </p>
</section>
