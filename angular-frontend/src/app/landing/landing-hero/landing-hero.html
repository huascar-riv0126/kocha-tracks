<section class="bg-hero px-6 py-16 lg:px-20 lg:py-24">
  <div class="mx-auto grid max-w-7xl gap-10 lg:grid-cols-2 lg:items-center">
    <div class="flex flex-col items-start gap-5">
      <span class="inline-flex items-center gap-2 rounded-full border border-brand-primary-700 bg-brand-primary-800 px-3 py-1 font-mono text-[11px] font-semibold uppercase tracking-widest text-on-dark-muted">
        <span class="size-1.5 rounded-full bg-interactive-cta" aria-hidden="true"></span>
        {{ 'landing.hero.badge' | getStrings }}
      </span>
      <h1 class="max-w-xl text-4xl font-extrabold leading-tight text-on-dark lg:text-5xl">
        {{ 'landing.hero.title' | getStrings }}
      </h1>
    </div>

    <div class="flex flex-col items-start gap-6">
      <p class="max-w-xl text-base leading-6 text-on-dark-muted">
        {{ 'landing.hero.desc' | getStrings }}
      </p>
      <div class="flex flex-wrap gap-3">
        <button type="button" (click)="scrollTo('mapa')"
          class="rounded-md bg-interactive-cta px-5 py-2.5 text-sm font-bold text-white transition hover:bg-interactive-cta-hover">
          {{ 'landing.hero.primary' | getStrings }}
        </button>
        <button type="button" (click)="scrollTo('por-que')"
          class="rounded-md border border-neutral-400 px-5 py-2.5 text-sm font-semibold text-on-dark transition hover:border-on-dark">
          {{ 'landing.hero.secondary' | getStrings }}
        </button>
      </div>
    </div>
  </div>
</section>
