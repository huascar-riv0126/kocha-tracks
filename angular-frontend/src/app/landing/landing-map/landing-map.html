<section id="mapa" class="flex scroll-mt-16 flex-col gap-8 bg-section-alt px-6 py-16 lg:px-20 lg:py-20">
  <div class="mx-auto flex w-full max-w-7xl flex-col gap-3">
    <p class="font-mono text-xs font-semibold uppercase tracking-widest text-interactive-cta">
      {{ 'landing.map.eyebrow' | getStrings }}
    </p>
    <h2 class="text-3xl font-extrabold text-txt-primary lg:text-4xl">
      {{ 'landing.map.title' | getStrings }}
    </h2>
  </div>
  <div class="mx-auto w-full max-w-7xl overflow-hidden rounded-xl border border-border-default bg-card shadow-sm">
    <app-map-view mapId="landing-map" [embedded]="true" />
  </div>
</section>
