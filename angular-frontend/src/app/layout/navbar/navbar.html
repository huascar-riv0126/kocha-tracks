<nav class="navbar">

  <div class="navbar-brand">
    <app-brand variant="dark" [isClickable]="true"></app-brand>
  </div>

  <ul class="navbar-links">

    <li>
      <a
        routerLink="/"
        routerLinkActive="active"
        [routerLinkActiveOptions]="{ exact: true }"
      >
        {{ "navbar.home" | transloco }}
      </a>
    </li>

    <li>
      <a
        routerLink="/map"
        routerLinkActive="active"
      >
        {{ "navbar.map" | transloco }}
      </a>
    </li>

    <li>
      <a href="#">
        {{ "navbar.history" | transloco }}
      </a>
    </li>

    <li>
      <a href="#">
        {{ "navbar.forum" | transloco }}
      </a>
    </li>

    <li>
      <a
        routerLink="/fuentes"
        routerLinkActive="active"
      >
        {{ "navbar.sources" | transloco }}
      </a>
    </li>

  </ul>

  <div class="navbar-auth">

    <div class="lang-selector">
      <button
        type="button"
        class="lang-btn"
        [class.active]="currentLang() === 'es'"
        (click)="changeLang('es')"
        aria-label="Español"
      >
        ES
      </button>
      <span class="lang-sep">|</span>
      <button
        type="button"
        class="lang-btn"
        [class.active]="currentLang() === 'en'"
        (click)="changeLang('en')"
        aria-label="English"
      >
        EN
      </button>
    </div>

    <a
      routerLink="/register"
      class="btn-register"
    >
      {{ "navbar.sign.out" | transloco }}
    </a>

    <a
      routerLink="/login"
      routerLinkActive="active"
      class="btn-login"
    >
      {{ "navbar.sign.in" | transloco }}
    </a>

  </div>

</nav>
