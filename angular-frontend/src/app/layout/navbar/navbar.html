<nav class="navbar">
  <div class="navbar-brand">
    <div class="logo-icon">
      <!-- Icono SVG de ubicación (Pin) -->
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"></path>
        <circle cx="12" cy="10" r="3"></circle>
      </svg>
    </div>
    <span class="brand-text">{{ "brand" | getStrings }}</span>
  </div>

  <ul class="navbar-links">
    <li><a routerLink="/" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">{{ "navbar.home" | getStrings }}</a></li>
    <li><a routerLink="/map" routerLinkActive="active">{{ "navbar.map" | getStrings }}</a></li>
    <li><a href="#">{{ "navbar.history" | getStrings }}</a></li>
    <li><a href="#">{{ "navbar.forum" | getStrings }}</a></li>
    <li><a routerLink="/fuentes" routerLinkActive="active">{{ "navbar.sources" | getStrings }}</a></li>
  </ul>

  <div class="navbar-auth">
    <a href="#" class="btn-register">{{ "navbar.sign.out" | getStrings }}</a>
    <button class="btn-login">{{ "navbar.sign.in" | getStrings }}</button>
  </div>
</nav>
