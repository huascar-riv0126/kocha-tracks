services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: kocha_tracks_db
      POSTGRES_USER: kocha
      # Credencial pública y exclusiva para esta base de desarrollo local.
      POSTGRES_PASSWORD: kocha_local
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 2s
      timeout: 5s
      retries: 15
      start_period: 5s

volumes:
  postgres_data:
